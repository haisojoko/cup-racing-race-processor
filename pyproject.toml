[project]
name = "cup-racing-race-processor"
version = "0.2.0"
description = "Processes Assetto Corsa server result JSONs into structured race detail data for the Cup Racing league."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
race-processor = "race_processor.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, so auto-discovery doesn't try to package the inbox/ and dataset/
# data folders at the repo root (they are data, not importable code).
packages = ["race_processor"]

[tool.setuptools.package-data]
race_processor = ["SCHEMA.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
